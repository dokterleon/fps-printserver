<!doctype html>
<html>
<head><meta charset="UTF-8"><title>WiFi Setup</title>
<style>
body{font-family:sans-serif;max-width:400px;margin:40px auto;padding:20px;background:#111;color:#fff}
input{width:100%;padding:10px;margin:8px 0;box-sizing:border-box;border:1px solid #333;border-radius:4px;background:#222;color:#fff}
button{width:100%;padding:12px;background:#00AAFF;color:white;border:none;border-radius:4px;font-size:16px;cursor:pointer;margin-top:8px}
.net{padding:10px;background:#222;border:1px solid #333;border-radius:4px;margin:4px 0;cursor:pointer}
.net:hover{background:#333}
#msg{margin-top:10px;padding:10px;border-radius:4px}
</style></head>
<body>
<h2>📶 WiFi verbinden</h2>
<button onclick="scan()">🔍 Netwerken scannen</button>
<div id="nets"></div>
<br>
<input id="ssid" placeholder="WiFi naam" autocorrect="off" autocapitalize="off">
<input id="pass" type="password" placeholder="Wachtwoord">
<button onclick="verbinden()">Verbinden</button>
<div id="msg"></div>
<script>
async function scan(){
  document.getElementById('nets').innerHTML = 'Scannen...';
  const r = await fetch('/api/wifi/scan');
  const d = await r.json();
  if(d.networks && d.networks.length){
    document.getElementById('nets').innerHTML = d.networks.map(n =>
      `<div class="net" onclick="document.getElementById('ssid').value='${n}'">${n}</div>`
    ).join('');
  } else {
    document.getElementById('nets').innerHTML = 'Geen netwerken gevonden';
  }
}
async function verbinden(){
  const ssid = document.getElementById('ssid').value;
  const pass = document.getElementById('pass').value;
  if(!ssid){ alert('Vul een netwerknaam in'); return; }
  document.getElementById('msg').innerHTML = '⏳ Verbinden...';
  const r = await fetch('/wifi-connect-direct', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ssid, password:pass})
  });
  const d = await r.json();
  document.getElementById('msg').innerHTML = d.ok ? '✅ Verbonden!' : '❌ Mislukt';
}
</script>
</body>
</html>
